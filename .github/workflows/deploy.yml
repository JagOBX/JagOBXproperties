name: Build and publish site

# Builds the site into docs/ and commits the result. GitHub Pages is set to
# serve this repo from the docs/ folder on main, so committing there publishes.
#
# Article pages build on their own, so a new article publishes even if the
# React app is not present yet.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the website script
        id: check
        run: |
          if [ -f src/App.jsx ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src/App.jsx not found, so only the article pages will be built."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Only the React app depends on src/App.jsx. Skipping this step leaves the
      # existing bundle in docs/ untouched rather than publishing a broken site.
      - name: Build the app
        if: steps.check.outputs.found == 'true'
        run: |
          rm -f docs/assets/index-*.js
          npx vite build

      - name: Build the article pages
        run: npm run build:articles

      - name: Commit the built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Build output unchanged."
          else
            git commit -m "Build site [skip ci]"
            git push
          fi
